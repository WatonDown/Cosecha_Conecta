<!doctype html><html lang="es-CL" data-theme="light"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Cosecha Conecta</title>
<meta name="description" content="Mercado agrícola de O’Higgins para comercializar cosechas, coordinar traslados y gestionar excedentes y pérdidas.">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barra superior con logo + nav desplazable; vistas en una columna con grillas que colapsan a 1 columna en teléfono */
:root{
  --em:#087F5B; --em-ink:#ffffff; --em-soft:#E2F4EC; --em-deep:#065E43;
  --lime:#A3E635; --lime-soft:#EEF9D6;
  --orange:#F97316; --orange-soft:#FFEEDD;
  --gold:#FACC15; --gold-soft:#FEF6CC;
  --blue:#2563EB; --blue-soft:#E3EBFD;
  --coral:#EF4444; --coral-soft:#FDE6E6;
  --bg:#FBF8F1; --surface:#FFFFFF; --surface-2:#F5F1E6; --line:#E5DFCF;
  --ink:#15241C; --muted:#56665D; --on-lime:#1B2A0A;
  --shadow:0 1px 2px rgba(21,36,28,.06),0 6px 18px rgba(21,36,28,.06);
  --f-display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --em:#2FBF8C; --em-ink:#062818; --em-soft:#12342A; --em-deep:#7DDCB5;
  --lime:#B5EE5A; --lime-soft:#26331A; --orange:#FB923C; --orange-soft:#3A2414;
  --gold:#FDE047; --gold-soft:#36301A; --blue:#6E9BFA; --blue-soft:#1A2540;
  --coral:#F87171; --coral-soft:#3A1C1C;
  --bg:#0E1511; --surface:#16211A; --surface-2:#1C2921; --line:#2B3A31;
  --ink:#E8F1EB; --muted:#9FB2A7; --on-lime:#14200A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --em:#2FBF8C; --em-ink:#062818; --em-soft:#12342A; --em-deep:#7DDCB5;
  --lime:#B5EE5A; --lime-soft:#26331A; --orange:#FB923C; --orange-soft:#3A2414;
  --gold:#FDE047; --gold-soft:#36301A; --blue:#6E9BFA; --blue-soft:#1A2540;
  --coral:#F87171; --coral-soft:#3A1C1C;
  --bg:#0E1511; --surface:#16211A; --surface-2:#1C2921; --line:#2B3A31;
  --ink:#E8F1EB; --muted:#9FB2A7; --on-lime:#14200A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }

html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,5vw,44px)} h2{font-size:clamp(21px,3vw,27px)} h3{font-size:18px} h4{font-size:15px}
p{margin:0}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.num,td,.kpi b{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Barra superior */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none;color:inherit}
.logo .l1{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.1;color:var(--ink)}
.logo .l1{font-size:18px;letter-spacing:-.02em}
.logo .l2{font-family:var(--f-display);font-weight:700;font-size:13px;line-height:1.1;color:var(--em);letter-spacing:.18em;text-transform:uppercase;display:flex;align-items:center;gap:5px}
.logo .l2 i{display:inline-block;width:18px;height:6px;background:radial-gradient(circle at 3px 3px,var(--orange) 2.6px,transparent 3px),radial-gradient(circle at 15px 3px,var(--orange) 2.6px,transparent 3px),linear-gradient(var(--orange),var(--orange)) 3px 2.4px/12px 1.2px no-repeat}
.fi{display:inline-grid;place-items:center;border-radius:10px;flex:none;vertical-align:middle}
.fi svg{display:block}
.prod-cell{display:flex;align-items:center;gap:10px}
.ph-art{position:absolute;inset:0;display:grid;place-items:center}
.ph-art svg{width:58%;height:auto;max-height:86%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.12))}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pick label{display:grid;justify-items:center;gap:4px;border:2px solid var(--line);border-radius:12px;padding:8px 4px;cursor:pointer;background:var(--surface);font-size:12.5px;font-weight:700}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick label:has(input:checked){border-color:var(--em);background:var(--em-soft)}
.pick label:has(input:focus-visible){outline:3px solid var(--blue);outline-offset:2px}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;counter-reset:f}
@media (max-width:820px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.flow{grid-template-columns:minmax(0,1fr)}}
.flow div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;align-content:start}
.flow div b::before{counter-increment:f;content:counter(f);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;margin-right:8px}
.resv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.resv .date{min-width:74px;text-align:center;border-radius:12px;background:var(--blue-soft);color:var(--blue);padding:8px 6px;display:grid;gap:0}
.resv .date b{font-family:var(--f-display);font-size:26px;line-height:1}
.resv .date span{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.hero-logo{display:grid;place-items:center;position:absolute;inset:0}
.hero-fruits{position:absolute;inset:auto 0 0 0;display:flex;justify-content:center;gap:6px;padding:14px;flex-wrap:wrap}
.spacer{flex:1}
.mode-pill{border:0;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.mode-pill.demo{background:var(--gold);color:#3B2F00}
.mode-pill.real{background:var(--em-soft);color:var(--em-deep)}
.user-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;max-width:220px}
.user-chip .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--em);color:var(--em-ink);font-weight:800;font-size:12px;flex:none}
.user-chip span.nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbar{border-top:1px solid var(--line);background:var(--surface)}
.navbar .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:6px}
.navbar .wrap::-webkit-scrollbar{display:none}
.navbar a{flex:none;text-decoration:none;color:var(--muted);font-weight:700;font-size:14px;padding:9px 14px;border-radius:10px;white-space:nowrap}
.navbar a:hover{background:var(--surface-2);color:var(--ink)}
.navbar a.on{background:var(--em);color:var(--em-ink)}
.demo-band{background:var(--gold-soft);color:var(--ink);font-size:13px;border-bottom:1px solid var(--line)}
.demo-band .wrap{padding-block:7px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo-band b{color:var(--orange)}
@media (max-width:560px){.user-chip span.nm{display:none}.user-chip{padding:4px}}
@media (max-width:350px){.logo .txt{display:none}}

main{padding-block:24px 64px}
.view{display:grid;gap:22px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head p{color:var(--muted);max-width:62ch}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--em)}

/* Superficies */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpis.k8{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){.kpis.k8{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi b{overflow-wrap:anywhere}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:4px;align-content:start}
.kpi .k{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-family:var(--f-display);font-size:24px;line-height:1.1}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.loss{border-color:color-mix(in srgb,var(--coral) 40%,var(--line));background:linear-gradient(0deg,var(--coral-soft),var(--surface) 70%)}
.kpi.loss b{color:var(--coral)}
.kpi.ok b{color:var(--em)}
.kpi.sale{background:linear-gradient(0deg,var(--lime-soft),var(--surface) 70%)}
.kpi.info b{color:var(--blue)}
.kpi.warn b{color:var(--orange)}
.sim-tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;padding:2px 7px;border-radius:999px;background:var(--gold);color:#3B2F00;vertical-align:middle}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:11px 16px;font-weight:800;font-size:14.5px;cursor:pointer;min-height:44px;text-decoration:none;transition:transform .12s ease,box-shadow .12s ease,background .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(8,127,91,.18)}
.btn:active{transform:none}
.btn.pri{background:var(--em);color:var(--em-ink)}
.btn.sec{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.ora{background:var(--orange);color:#fff}
.btn.lime{background:var(--lime);color:var(--on-lime)}
.btn.blue{background:var(--blue);color:#fff}
.btn.danger{background:var(--surface);border-color:color-mix(in srgb,var(--coral) 50%,var(--line));color:var(--coral)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13px;border-radius:10px}
.btn.big{min-height:54px;font-size:16px;padding:14px 22px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn-rescue{background:linear-gradient(90deg,var(--orange),#E8590C);color:#fff;letter-spacing:.03em}
@media (prefers-reduced-motion:reduce){.btn,.bar i{transition:none}.btn:hover{transform:none}}

/* Insignias */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;letter-spacing:.04em;padding:3px 9px;border-radius:999px;white-space:nowrap;text-transform:uppercase}
.b-loss{background:var(--coral-soft);color:var(--coral)}
.b-sell{background:var(--lime-soft);color:var(--em-deep)}
.b-risk{background:var(--gold-soft);color:#8A6A00}
:root[data-theme="dark"] .b-risk{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .b-risk{color:var(--gold)}}
.b-info{background:var(--blue-soft);color:var(--blue)}
.b-em{background:var(--em-soft);color:var(--em-deep)}
.b-ora{background:var(--orange-soft);color:var(--orange)}
.b-mute{background:var(--surface-2);color:var(--muted)}

/* Formularios */
.form{display:grid;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fgrid .full{grid-column:1/-1}
@media (max-width:620px){.fgrid{grid-template-columns:minmax(0,1fr)}}
label.f{display:grid;gap:5px;font-weight:700;font-size:13.5px}
label.f .h{font-weight:500;color:var(--muted);font-size:12.5px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],select,textarea{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:11px;background:var(--surface);padding:10px 12px;font-size:15px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--em);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--em) 22%,transparent)}
.err-msg{color:var(--coral);font-size:13px;font-weight:700}
.invalid{border-color:var(--coral)!important}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.choice label{display:grid;gap:4px;border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--surface)}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label b{font-size:14.5px}
.choice label span{font-size:12.5px;color:var(--muted)}
.choice label:has(input:checked){border-color:var(--em);background:var(--em-soft)}
.choice label.c-loss:has(input:checked){border-color:var(--coral);background:var(--coral-soft)}
.choice label.c-sell:has(input:checked){border-color:var(--em);background:var(--lime-soft)}
.choice label.c-risk:has(input:checked){border-color:#C9A100;background:var(--gold-soft)}
.choice label:has(input:focus-visible){outline:3px solid var(--blue);outline-offset:2px}
.calc{border-radius:12px;padding:14px;background:var(--surface-2);border:1px dashed var(--line);display:grid;gap:8px}
.calc .big{font-family:var(--f-display);font-size:26px;font-weight:700}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--gold);padding-left:10px}

/* Tablas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);font-weight:800}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
td select{min-width:190px;min-height:38px;padding:6px 10px;font-size:13.5px}
td.wrapcell{white-space:normal;min-width:180px}

/* Tabs internas */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);padding-bottom:0}
.tabs button{flex:none;border:0;background:none;padding:10px 14px;font-weight:800;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;font-size:14px}
.tabs button.on{color:var(--em);border-bottom-color:var(--em)}

/* Producto */
.prod{display:grid;grid-template-rows:auto 1fr;overflow:hidden;padding:0}
.prod .ph{aspect-ratio:16/9;position:relative;display:grid;place-items:center;max-width:100%}
.prod .ph img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.prod .ph .fb{font-family:var(--f-display);font-weight:700;font-size:22px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.25)}
.prod .ph .badge{position:absolute;left:10px;top:10px}
.prod .bd{padding:14px;display:grid;gap:6px;align-content:start}
.prod .pr{font-family:var(--f-display);font-weight:700;font-size:20px}
.photo-cap{position:absolute;right:8px;bottom:6px;font-size:10.5px;color:#fff;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:6px}

/* Barra de progreso */
.bar{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--em),var(--lime));transition:width .5s ease}
.stackbar{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.stackbar i{display:block;height:100%}

/* Hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:center}
.hero .lead{font-size:16.5px;color:var(--muted);max-width:56ch;margin-top:12px}
.hero-ph{border-radius:18px;overflow:hidden;aspect-ratio:4/3;position:relative;background:radial-gradient(circle at 50% 40%,#FFFDF7 0,#FBF4E4 70%);border:1px solid var(--line);max-width:100%}
.hero-ph > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-ph .fbx{position:absolute;inset:0;display:grid;place-items:center;padding:20px}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}

/* Demo */
.demo-panel{border:2px solid var(--gold);background:linear-gradient(180deg,var(--gold-soft),var(--surface) 55%)}
.cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:820px){.cases{grid-template-columns:minmax(0,1fr)}}
.case{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px;display:grid;gap:8px;align-content:start}
.case .n{font-family:var(--f-display);font-weight:700;color:var(--orange);font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.steps{display:flex;flex-wrap:wrap;gap:8px}
.steps .btn.done{background:var(--em-soft);color:var(--em-deep);border-color:transparent}
.console{display:grid;gap:10px;max-height:420px;overflow:auto;padding-right:4px}
.log{border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:12px 14px;display:grid;gap:6px;font-size:14px}
.log.loss{border-left:5px solid var(--coral)} .log.sell{border-left:5px solid var(--em)} .log.info{border-left:5px solid var(--blue)} .log.warn{border-left:5px solid var(--orange)}
.log .t{font-size:11.5px;color:var(--muted);font-weight:700}

/* Mapa */
.map-shell{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.map-shell{grid-template-columns:minmax(0,1fr)}}
.map{height:430px;border-radius:14px;border:1px solid var(--line);overflow:hidden;position:relative;background:var(--surface-2);z-index:1}
@media (max-width:620px){.map{height:340px}}
.map.no-tiles{background-color:#e8eeea;background-image:linear-gradient(#18576315 1px,transparent 1px),linear-gradient(90deg,#18576315 1px,transparent 1px);background-size:32px 32px}
.map-note{position:absolute;left:54px;right:10px;top:10px;width:fit-content;z-index:500;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.875rem;display:none}
.map.no-tiles .map-note:not(:empty){display:block}
.map .leaflet-tile-failed{visibility:hidden}
.map-tools{display:flex;gap:8px;flex-wrap:wrap}
.comuna-lbl{font:700 11px var(--f-body);color:#3d4f45;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff;pointer-events:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.leaflet-container{font-family:var(--f-body)}
.leaflet-popup-content{font-size:13px;line-height:1.45}
.drawing .leaflet-container{cursor:crosshair}

/* Gráficos */
.chart-box{position:relative;height:250px}
.chart-card h4{margin-bottom:10px}

/* Modal y toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,20,14,.55);z-index:1000;display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{background:var(--surface);border-radius:18px;max-width:760px;width:100%;max-height:calc(100dvh - 40px);overflow:auto;padding:22px;display:grid;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{border:0;background:var(--surface-2);border-radius:10px;width:40px;height:40px;font-size:20px;cursor:pointer;flex:none}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:2000;display:grid;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:var(--shadow);border-left:6px solid var(--lime)}
.toast.err{border-left-color:var(--coral)} .toast.warn{border-left-color:var(--gold)}

.empty{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;display:grid;gap:10px;justify-items:center;color:var(--muted)}
.ods{display:flex;gap:8px;flex-wrap:wrap}
.ods span{padding:8px 12px;border-radius:10px;font-weight:700;font-size:13px;color:#fff}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:54px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.match{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px;background:var(--surface)}
.dest{border-radius:12px;padding:12px;display:grid;gap:4px;background:var(--surface-2)}
.dest b{font-size:14.5px}
.foot{border-top:1px solid var(--line);padding-block:22px;color:var(--muted);font-size:13px}
.only-print{display:none}
@media print{
  .topbar,.navbar,.demo-band,.no-print,.toasts,.foot{display:none!important}
  body{background:#fff;color:#000} .card,.kpi{box-shadow:none;break-inside:avoid}
  .only-print{display:block}
}

#fPublicar[data-tipo=reserva] .no-reserva{display:none!important}
#fPublicar:not([data-tipo=reserva]) .only-reserva{display:none!important}
.mode-pill .ps{display:none}
@media (max-width:560px){.mode-pill .pl{display:none}.mode-pill .ps{display:inline}.topbar .wrap{gap:8px}}

.logo{background:#FCF8EF;border-radius:12px;padding:4px 10px}
.logo-img{height:46px;width:auto;display:block}
@media (max-width:560px){.logo-img{height:38px}}
.fi{overflow:hidden;background:var(--surface-2)}
.fi img{width:100%;height:100%;object-fit:cover;display:block}
.hero-logo{position:absolute;inset:0 0 70px 0;display:grid;place-items:center;padding:16px}
.hero-logo img{position:absolute;inset:14px;width:calc(100% - 28px)!important;height:calc(100% - 28px)!important;object-fit:contain}
.hero-fruits{position:absolute;inset:auto 0 0 0;display:flex;justify-content:center;gap:6px;padding:12px;flex-wrap:wrap}
.hero-fruits .fi{border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.pick label img{width:72px!important;height:54px!important}

.rating{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.rating b{font-variant-numeric:tabular-nums}
.stars{position:relative;display:inline-block;color:color-mix(in srgb,var(--muted) 35%,transparent);letter-spacing:1px;font-size:15px;line-height:1}
.stars .on{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:#F5B700}
.rating.big .stars{font-size:20px}
.rating.big{font-size:15px}
.starpick{display:flex;gap:2px}
.starpick button{border:0;background:none;font-size:34px;line-height:1;cursor:pointer;color:color-mix(in srgb,var(--muted) 35%,transparent);padding:2px}
.starpick button.on{color:#F5B700}
.opinion{display:grid;gap:4px;border-top:1px solid var(--line);padding-top:8px}
.hero-logo{inset:0!important}

.kpis.k10{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:980px){.kpis.k10{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.kpis.k10{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cases .case:last-child:nth-child(odd){grid-column:1/-1}

function kgComprometido(ofId, exceptLoteId) {

function cultivoStats(c) {
  const prod = prodRef(c);
  const ps = DB.perdidas.filter(p => p.cultivoId === c.id);
  const perd = sum(ps.filter(p => p.situacion === 'perdida'), 'kg');
  const comerc = sum(ps.filter(p => p.situacion === 'comercializable'), 'kg');
  const riesgo = sum(ps.filter(p => p.situacion === 'riesgo'), 'kg');
  const valorPerd = sum(ps.filter(p => p.situacion === 'perdida'), p => num(p.kg) * num(p.precioKg));
  const valorComerc = sum(ps.filter(p => p.situacion === 'comercializable'), p => num(p.kg) * num(p.precioKg));
  const valorRiesgo = sum(ps.filter(p => p.situacion === 'riesgo'), p => num(p.kg) * num(p.precioKg));
  const ofs = DB.ofertas.filter(o => o.cultivoId === c.id && o.estado !== 'retirada');
  const ofertado = sum(ofs, 'kg');
  const comprometido = sum(ofs, o => kgComprometido(o.id));

  const ingresos = sum(ofs, o => ingresosOferta(o.id));
  const disponible = sum(ofs, o => dispOferta(o));
  const sinPublicar = sum(ps, p => restanteComercializable(p));
  const libre = prod - perd - ofertado - sinPublicar;
  return {prod, perd, comerc, riesgo, valorPerd, valorComerc, valorRiesgo, ofertado, comprometido, vendido, ingresos, disponible, sinPublicar, libre, pct: prod ? perd / prod * 100 : 0, comercializableDisp: disponible + sinPublicar};

/* ====================== Reglas comerciales (validadas) ====================== */
function validarAporte(ofId, kg, loteId) {
  const o = oferta(ofId);
  if (!o) return 'La oferta no existe.';
  if (o.estado === 'retirada') return 'La oferta fue retirada del mercado.';
  if (o.origenPerdidaId) { const p = DB.perdidas.find(x => x.id === o.origenPerdidaId); if (p && p.situacion === 'perdida') return 'Un producto declarado como pérdida efectiva no se puede vender.'; }
  if (!(kg > 0)) return 'Indica una cantidad mayor que cero.';
  const disp = num(o.kg) - kgComprometido(ofId, loteId) - (loteId ? sum((lote(loteId)?.aportes || []).filter(a => a.ofertaId === ofId), 'kg') : 0);
  if (kg > disp + 1e-9) {
    const lots = activeLotes().filter(l => l.aportes.some(a => a.ofertaId === ofId)).map(l => (l.reserva ? 'una reserva' : l.colaborativo ? 'un lote colaborativo' : 'un acuerdo directo') + ' con ' + userName(l.buyerId));
    return `Solo hay ${fmtKg(Math.max(0, disp))} disponibles de esta oferta. El resto ya está comprometido${lots.length ? ' en ' + [...new Set(lots)].join(', ') : ''}. Un mismo kilo no puede comprometerse dos veces.`;
  }
  return null;
}
function agregarAporte(loteId, ofId, kg) {
  const l = lote(loteId); const err = validarAporte(ofId, kg, loteId);
  if (err) return err;
  if (l.estado !== 'abierto') return 'Solo se pueden sumar aportes a lotes en negociación.';
  const o = oferta(ofId);
  if (o.producto !== l.producto) return `El producto (${o.producto}) no coincide con el lote (${l.producto}).`;
  const ex = l.aportes.find(a => a.ofertaId === ofId);
  if (ex) ex.kg += kg; else l.aportes.push({id:uid('a'), ofertaId:ofId, farmerId:o.farmerId, kg});
  l.colaborativo = new Set(l.aportes.map(a => a.farmerId)).size > 1 || l.colaborativo;
  l.historial.push({f:todayISO(), t:`${userName(o.farmerId)} aporta ${fmtKg(kg)}.`});

}
function proponerLote(solId, preferOfId) {
  const s = solicitud(solId); if (!s) return {err:'Solicitud no encontrada.'};
  let l = DB.lotes.find(x => x.solicitudId === solId && x.estado === 'abierto');
  let falt = faltanteSolicitud(s);
  if (falt <= 0) return {err:'La solicitud ya está cubierta.', lote:l};
  const cands = DB.ofertas.filter(o => o.producto === s.producto && o.estado === 'publicada' && dispOferta(o) > 0 && (CAL_RANK[o.calidad] || 0) >= (CAL_RANK[s.calidadMin] || 0))
    .map(o => ({o, disp:dispOferta(o), km:distKm(o.comuna, s.comuna) ?? 999}))
    .sort((a, b) => (b.o.id === preferOfId) - (a.o.id === preferOfId) || a.km - b.km);
  if (!cands.length) return {err:`No hay ofertas disponibles de ${s.producto} con la calidad requerida.`};
  if (!l) { l = {id:uid('l'), solicitudId:solId, buyerId:s.buyerId, producto:s.producto, meta:num(s.kg), precioKg:num(s.precioKg), colaborativo:false, estado:'abierto', creado:todayISO(), aportes:[], historial:[{f:todayISO(), t:`Lote propuesto por la plataforma para la solicitud de ${userName(s.buyerId)}.`}]}; DB.lotes.push(l); }
  const added = [];

  const l = lote(id); if (!l || l.estado !== 'abierto') return 'El lote no está en negociación.';
  const total = sum(l.aportes, 'kg');
  if (total + 1e-9 < num(l.meta)) return `Faltan ${fmtKg(num(l.meta) - total)} para completar el pedido. Suma aportes o reduce la meta con el comprador.`;

const VEHICULOS = {
  camioneta: {label:'Camioneta', cap:1000, base:15000, km:1200},
  camion34:  {label:'Camión 3/4', cap:4000, base:25000, km:1800},

const T_REFRIG = 0.25, T_KG = 8, T_COMISION = 0.10, T_RUTA = 1.3;

function cotizar(kg, km, refrigerado) {
  const kgN = num(kg); let key = Object.keys(VEHICULOS).find(k => VEHICULOS[k].cap >= kgN) || 'camion';
  const v = VEHICULOS[key]; const n = Math.max(1, Math.ceil(kgN / v.cap));

}

  l.aportes.forEach(a => { const o = oferta(a.ofertaId); const c = o ? o.comuna : (user(a.farmerId) || {}).comuna; const k = a.farmerId + '|' + c; (map[k] = map[k] || {farmerId:a.farmerId, comuna:c, kg:0}).kg += num(a.kg); });
  const destino = {buyerId:l.buyerId, comuna:(user(l.buyerId) || {}).comuna || 'San Fernando'};
  const paradas = Object.values(map).sort((a, b) => (distKm(b.comuna, destino.comuna) || 0) - (distKm(a.comuna, destino.comuna) || 0));
  const pts = [...paradas.map(p => p.comuna), destino.comuna];
  let km = 0; for (let i = 0; i < pts.length - 1; i++) km += Math.max(5, distKm(pts.at(i), pts.at(i + 1)) || 5);
  return {paradas, destino, km:Math.round(km * T_RUTA)};
}

  const lat0 = pts.reduce((a, p) => a + p[0], 0) / pts.length * Math.PI / 180;
  const xy = pts.map(p => [p[1] * Math.PI / 180 * 6371000 * Math.cos(lat0), p[0] * Math.PI / 180 * 6371000]);
  let a = 0; for (let i = 0; i < xy.length; i++) { const [x1, y1] = xy[i], [x2, y2] = xy[(i + 1) % xy.length]; a += x1 * y2 - x2 * y1; }
  return Math.abs(a) / 2 / 10000;
}

function mountPredioMap(p) {
  const m = baseMap('mapPredio', [p.lat, p.lng], p.limite ? 16 : 14); if (!m) return;
  const cs = DB.cultivos.filter(c => c.predioId === p.id && c.temporada === UI.temporada); const st = aggStats(cs);
  const pop = `<b>${esc(p.nombre)}</b><br>${cs.map(c => esc(c.cultivo)).join(', ') || 'Sin cultivos'}<br>Producción: ${fmtKg(st.prod)}<br>Pérdidas: ${fmtKg(st.perd)} (${fmtPct(st.pct)})<br>Valor bruto: ${fmtCLP(st.valorPerd)}<br>Ingresos plataforma: ${fmtCLP(st.ingresos)}`;
  const col = lossColor(st.pct);
  if (p.limite && p.limite.length >= 3) { const poly = L.polygon(p.limite, {color:col, weight:3, fillOpacity:.25}).addTo(m).bindPopup(pop); m.fitBounds(poly.getBounds(), {padding:[30, 30]}); }
  L.circleMarker([p.lat, p.lng], {radius:10, color:'#fff', weight:3, fillColor:col, fillOpacity:1}).addTo(m).bindPopup(pop);
  if (UI.draw === 'limite' && UI.drawPts && UI.drawPts.length) {
    L.polyline(UI.drawPts.concat(UI.drawPts.length > 2 ? [UI.drawPts[0]] : []), {color:'#2563EB', dashArray:'6 6', weight:3}).addTo(m);
    UI.drawPts.forEach(pt => L.circleMarker(pt, {radius:5, color:'#2563EB', fillColor:'#fff', fillOpacity:1}).addTo(m));
    m.setView(UI.drawView || [p.lat, p.lng], UI.drawZoom || 16);
  }
  m.on('click', e => {
    if (!UI.draw) return;
    UI.drawView = [e.latlng.lat, e.latlng.lng]; UI.drawZoom = m.getZoom();
    if (UI.draw === 'punto') { p.lat = +e.latlng.lat.toFixed(6); p.lng = +e.latlng.lng.toFixed(6); p.ubicacionAproximada = false; UI.draw = null; save(); toast('Ubicación del predio guardada.'); render(); }
    else { UI.drawPts = (UI.drawPts || []).concat([[+e.latlng.lat.toFixed(6), +e.latlng.lng.toFixed(6)]]); render(); }
  });
}

function updateLossCalc() {
  const f = $('#fPerdida'); if (!f) return;

  const pct = ref ? kg / ref * 100 : 0, val = kg * pr;
  const c = cultivo(f.cultivoId.value); const s = c ? cultivoStats(c) : null;
  const msg = {perdida:'Valor comercial estimado de lo perdido. No es la pérdida económica definitiva: no descuenta costos que no se alcanzaron a gastar (cosecha, flete, envases) ni ingresos por destinos alternativos.',
    comercializable:'No se suma como pérdida. Después de guardar podrás usar BUSCAR SOLUCIÓN COMERCIAL para publicarlo y encontrar compradores.',
    riesgo:'Valor de la producción que podría perderse si no se actúa. No se suma como pérdida.'}[sit];
  const lab = {perdida:'Valor bruto estimado de la pérdida', comercializable:'Valor comercial del producto aprovechable', riesgo:'Valor en riesgo'}[sit];
  $('#lossCalc').innerHTML = `<div class="grid g3"><div><span class="small muted">Porcentaje sobre la producción</span><div class="big" style="color:${sit === 'perdida' ? 'var(--coral)' : 'inherit'}">${fmtPct(pct)}</div><span class="small muted">(${fmtN(kg)} / ${fmtN(ref)}) × 100</span></div>
    <div><span class="small muted">${lab}</span><div class="big">${fmtCLP(val)}</div><span class="small muted">${fmtN(kg)} kg × ${fmtCLP(pr)}</span></div>
    <div><span class="small muted">Kilos del cultivo sin asignar</span><div class="big">${s ? fmtKg(Math.max(0, s.libre)) : '—'}</div><span class="small muted">no perdidos, ni publicados, ni marcados como comercializables</span></div></div><p class="note">${msg}</p>`;
}

    <td><select data-chg="verif" data-id="${x.id}" aria-label="Verificación">${opts(Object.entries(VERIF), x.verificacion)}</select></td>
    <td>${x.fotos && x.fotos.length ? `<div class="thumbs">${x.fotos.map(f => `<img src="${f}" alt="Evidencia">`).join('')}</div>` : '<span class="muted small">—</span>'}</td></tr>`; }).join('')}</tbody></table></div>
  ${ps.some(x => x.descripcion) ? `<div class="card flat stack"><h4>Descripciones</h4>${ps.filter(x => x.descripcion).map(x => `<p class="small"><b>${fmtDate(x.fecha)} · ${esc(cultivo(x.cultivoId)?.cultivo)}:</b> ${esc(x.descripcion)}</p>`).join('')}</div>` : ''}`;
}

    const cz = CAUSAS.filter(c => efect.some(x => x.causa === c.id));

    const mlab = months.map(([y, m]) => new Date(y, m, 1).toLocaleDateString('es-CL', {month:'short'}));
    const mk = sit => months.map(([y, m]) => sum(ps.filter(x => x.situacion === sit && +x.fecha.slice(0, 4) === y && +x.fecha.slice(5, 7) === m + 1), 'kg'));
    chart('chMes', {type:'line', data:{labels:mlab, datasets:[{label:'Pérdida efectiva', data:mk('perdida'), borderColor:'#EF4444', backgroundColor:'rgba(239,68,68,.15)', fill:true, tension:.15}, {label:'Comercializable', data:mk('comercializable'), borderColor:'#087F5B', tension:.15}, {label:'En riesgo', data:mk('riesgo'), borderColor:'#FACC15', tension:.15}]}});
    chart('chProd', {type:'bar', data:{labels:lab, datasets:[{label:'Producción', data:S.map(s => s.prod), backgroundColor:'#087F5B', borderRadius:6}, {label:'Pérdida efectiva', data:S.map(s => s.perd), backgroundColor:'#EF4444', borderRadius:6}, {label:'Comercializable', data:S.map(s => s.comerc), backgroundColor:'#A3E635', borderRadius:6}]}});
    chart('chValor', {type:'bar', data:{labels:lab, datasets:[{label:'Valor bruto perdido', data:S.map(s => s.valorPerd), backgroundColor:'#EF4444', borderRadius:6}, {label:'Valor comercializable', data:S.map(s => s.valorComerc), backgroundColor:'#A3E635', borderRadius:6}, {label:'Valor en riesgo', data:S.map(s => s.valorRiesgo), backgroundColor:'#FACC15', borderRadius:6}]}, options:{scales:{x:{grid:{color:cssVar('--line')}}, y:{beginAtZero:true, grid:{color:cssVar('--line')}, ticks:{callback:v => fmtCLP(v)}}}}});
    const A = aggStats(cs);
    chart('chPlat', {type:'doughnut', data:{labels:['Vendido vía Cosecha Conecta','Comprometido en acuerdos','Disponible para vender','Pérdida efectiva'], datasets:[{data:[A.vendido, A.comprometido - A.vendido, A.comercializableDisp, A.perd], backgroundColor:['#087F5B','#2563EB','#A3E635','#EF4444'], borderWidth:2, borderColor:cssVar('--surface')}]}, options:{cutout:'62%', plugins:{tooltip:{callbacks:{label:x => `${x.label}: ${fmtKg(x.raw)}`}}}}});
  });
  if (!cs.length) return `<div class="card">${noData()}</div>`;
  const box = (id, t, empty) => `<div class="card chart-card"><h4>${t}</h4>${empty ? noData() : `<div class="chart-box"><canvas id="${id}"></canvas></div>`}</div>`;
  return `<div class="grid g2">${box('chCultivo', 'Pérdidas por cultivo (kg)')}${box('chCausa', 'Pérdidas por causa', !efect.length)}${box('chMes', 'Evolución mensual de la temporada (kg)')}${box('chProd', 'Producción y pérdidas por cultivo (kg)')}${box('chValor', 'Valor económico de productos afectados (CLP)')}${box('chPlat', 'Destino de la producción comercializable (kg)')}</div>`;
}

function vMapa() {
  const f = UI.mapaFiltro; const u = me();
  const ps = DB.perdidas.filter(x => { const c = cultivo(x.cultivoId); return c && (f.temporada === 'todas' || c.temporada === f.temporada) && (f.cultivo === 'todos' || c.cultivo === f.cultivo) && (f.causa === 'todas' || x.causa === f.causa); });
  const ef = ps.filter(x => x.situacion === 'perdida');
  const byPredio = {};
  ps.forEach(x => { const b = byPredio[x.predioId] = byPredio[x.predioId] || {perd:0, val:0, com:0, ries:0, causas:{}}; if (x.situacion === 'perdida') { b.perd += x.kg; b.val += x.kg * x.precioKg; b.causas[x.causa] = (b.causas[x.causa] || 0) + x.kg; } else if (x.situacion === 'comercializable') b.com += x.kg; else b.ries += x.kg; });
  const byCom = {};
  Object.entries(byPredio).forEach(([pid, b]) => { const p = predio(pid); const k = p.comuna; const cm = byCom[k] = byCom[k] || {perd:0, val:0, n:0, causas:{}}; cm.perd += b.perd; cm.val += b.val; cm.n++; for (const c in b.causas) cm.causas[c] = (cm.causas[c] || 0) + b.causas[c]; });
  const top = o => { const e = Object.entries(o).sort((a, b) => b[1] - a[1])[0]; return e ? CAUSA[e[0]].label : '—'; };
  const causasTot = {}; ef.forEach(x => causasTot[x.causa] = (causasTot[x.causa] || 0) + x.kg);
  const temps = [...new Set(DB.cultivos.map(c => c.temporada))].sort();
  after(() => {
    const m = baseMap('mapTerr', [-34.45, -71.1], 9); if (!m) return;
    Object.entries(byPredio).forEach(([pid, b]) => {
      const p = predio(pid); const own = u && p.ownerId === u.id;
      const cs = DB.cultivos.filter(c => c.predioId === pid && (f.temporada === 'todas' || c.temporada === f.temporada) && (f.cultivo === 'todos' || c.cultivo === f.cultivo));
      const prod = sum(cs, c => prodRef(c)); const pct = prod ? b.perd / prod * 100 : 0;
      const ll = own ? [p.lat, p.lng] : [Math.round(p.lat * 50) / 50, Math.round(p.lng * 50) / 50];
      const r = 7 + Math.sqrt(b.perd) / 4;
      const pop = own ? `<b>${esc(p.nombre)}</b> (tu predio)<br>Kg perdidos: ${fmtKg(b.perd)} (${fmtPct(pct)})<br>Valor bruto: ${fmtCLP(b.val)}<br>Comercializable: ${fmtKg(b.com)} · En riesgo: ${fmtKg(b.ries)}<br>Causa principal: ${top(b.causas)}<br><a href="#predio">Abrir Mi Predio</a>`
        : `<b>Predio en ${esc(p.comuna)}</b><br><span style="color:#666">Ubicación aproximada para proteger al productor</span><br>Cultivos: ${esc(cs.map(c => c.cultivo).join(', '))}<br>Kg perdidos: ${fmtKg(b.perd)} (${fmtPct(pct)})<br>Comercializable: ${fmtKg(b.com)} · En riesgo: ${fmtKg(b.ries)}<br>Causa principal: ${top(b.causas)}`;
      L.circleMarker(ll, {radius:Math.min(r, 30), color:own ? '#2563EB' : '#fff', weight:own ? 4 : 2, fillColor:lossColor(pct), fillOpacity:.8}).addTo(m).bindPopup(pop);
      if (own && p.limite) L.polygon(p.limite, {color:'#2563EB', weight:2, fillOpacity:.1}).addTo(m);
    });
  });
  return `<div class="sec-head"><div><span class="eyebrow">Mapa de Pérdidas</span><h2>Dónde y por qué se pierde producción</h2></div><p class="small">Tu predio aparece con su ubicación exacta (borde azul). Los demás se muestran en una ubicación aproximada y sin nombres, para proteger a cada productor.</p></div>
  <div class="card flat"><div class="grid g3">
    <label class="f">Temporada<select data-c="mapaFiltro" data-f="temporada">${opts([['todas','Todas'], ...temps.map(t => [t, t])], f.temporada)}</select></label>
    <label class="f">Cultivo<select data-c="mapaFiltro" data-f="cultivo">${opts([['todos','Todos'], ...[...new Set(DB.cultivos.map(c => c.cultivo))].map(c => [c, c])], f.cultivo)}</select></label>
    <label class="f">Causa<select data-c="mapaFiltro" data-f="causa">${opts([['todas','Todas'], ...CAUSAS.map(c => [c.id, c.label])], f.causa)}</select></label></div></div>
  <div class="kpis">${kpi('Predios con registros', fmtN(Object.keys(byPredio).length))}${kpi('Kg perdidos', fmtKg(sum(ef, 'kg')), '', 'loss')}${kpi('Valor bruto estimado', fmtCLP(sum(ef, x => x.kg * x.precioKg)), 'no es pérdida neta', 'loss')}${kpi('Causa principal', top(causasTot), '', 'warn')}${kpi('Kg comercializables registrados', fmtKg(sum(ps.filter(x => x.situacion === 'comercializable'), 'kg')), '', 'ok')}${kpi('Kg en riesgo', fmtKg(sum(ps.filter(x => x.situacion === 'riesgo'), 'kg')), '', 'warn')}</div>
  <div class="map-shell"><div class="stack"><div class="map" id="mapTerr" aria-label="Mapa territorial de pérdidas"></div>
    <div class="legend"><span><i style="background:#087F5B"></i>Menos de 5%</span><span><i style="background:#FACC15"></i>5% a 10%</span><span><i style="background:#F97316"></i>10% a 20%</span><span><i style="background:#EF4444"></i>20% o más</span><span>Tamaño: kg perdidos</span></div></div>
    <aside class="card stack"><h3>Pérdidas por comuna</h3>${Object.keys(byCom).length ? `<div class="tbl-wrap"><table><thead><tr><th>Comuna</th><th class="r">Kg</th><th class="r">Valor bruto</th><th>Causa principal</th></tr></thead><tbody>${Object.entries(byCom).sort((a, b) => b[1].perd - a[1].perd).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="r">${fmtKg(v.perd)}</td><td class="r">${fmtCLP(v.val)}</td><td>${top(v.causas)}</td></tr>`).join('')}</tbody></table></div>` : noData()}</aside></div>`;
}

function route() { const h = location.hash.slice(1); const nv = VIEWS[h] ? h : 'inicio'; const changed = nv !== VIEW; VIEW = nv; UI.draw = null; render(!changed); if (changed) window.scrollTo(0, 0); }
function go(v) { if (location.hash.slice(1) === v) route(); else location.hash = v; }

document.addEventListener('change', e => {

function shrinkImage(file) {
  return new Promise(res => {
    if (!file || !file.type.startsWith('image/')) return res(null);
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => { const s = Math.min(1, 480 / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); try { res(cv.toDataURL('image/jpeg', .7)); } catch (e) { res(null); } }; img.onerror = () => res(null); img.src = r.result; };
    r.onerror = () => res(null); r.readAsDataURL(file);
  });
}

function exportCSV(kind) {
  const u = me(); let rows = [], name = `cosecha-conecta-${kind}-${todayISO()}.csv`;
  const t = UI.repTemporada;
  if (kind === 'resumen') { rows.push(['Temporada','Producción (kg)','Kg perdidos','% pérdida','Valor bruto pérdidas (CLP)','Kg comercializables registrados','Kg vendidos vía plataforma','Ingresos (CLP)']); [...new Set(cultivosDe(u.id).map(c => c.temporada))].sort().forEach(tt => { const s = aggStats(cultivosDe(u.id, tt)); rows.push([tt, s.prod, s.perd, s.pct.toFixed(1).replace('.', ','), Math.round(s.valorPerd), s.comerc, s.vendido, Math.round(s.ingresos)]); }); }
  if (kind === 'perdidas') { rows.push(['Fecha','Predio','Temporada','Cultivo','Variedad','Situación','Causa','Kg','Producción referencia (kg)','% sobre producción','Precio ref. (CLP/kg)','Valor bruto (CLP)','Verificación','Descripción']); const cids = cultivosDe(u.id, t).map(c => c.id); DB.perdidas.filter(x => cids.includes(x.cultivoId)).sort((a, b) => a.fecha.localeCompare(b.fecha)).forEach(x => { const c = cultivo(x.cultivoId); rows.push([x.fecha, predio(x.predioId).nombre, c.temporada, c.cultivo, c.variedad, SITUACION[x.situacion].label, CAUSA[x.causa].label, x.kg, x.prodRef, (x.kg / x.prodRef * 100).toFixed(1).replace('.', ','), x.precioKg, Math.round(x.kg * x.precioKg), VERIF[x.verificacion], x.descripcion]); }); }
  if (kind === 'operaciones') { rows.push(['Fecha','Comprador','Producto','Tipo','Mis kg','Precio (CLP/kg)','Monto (CLP)','Estado']); DB.lotes.filter(l => l.aportes.some(a => a.farmerId === u.id)).forEach(l => { const k = sum(l.aportes.filter(a => a.farmerId === u.id), 'kg'); rows.push([l.creado, userName(l.buyerId), l.producto, l.colaborativo ? 'Lote colaborativo' : 'Directo', k, l.precioKg, Math.round(k * l.precioKg), ESTADO_LOTE[l.estado].label]); }); }
  if (kind === 'compras') { rows.push(['Fecha','Producto','Productores','Kg','Precio (CLP/kg)','Total (CLP)','Estado']); DB.lotes.filter(l => l.buyerId === u.id).forEach(l => rows.push([l.creado, l.producto, l.aportes.map(a => userName(a.farmerId)).join(' / '), sum(l.aportes, 'kg'), l.precioKg, Math.round(sum(l.aportes, 'kg') * l.precioKg), ESTADO_LOTE[l.estado].label])); }
  if (kind === 'territorial') { rows.push(['Comuna','Productores','Producción (kg)','Kg perdidos','% pérdida','Valor bruto (CLP)','Kg vendidos vía plataforma']); terrRows().forEach(r => rows.push([r.comuna, r.n, r.s.prod, r.s.perd, r.s.pct.toFixed(1).replace('.', ','), Math.round(r.s.valorPerd), r.s.vendido])); }
  if (MODE === 'demo') rows.unshift(['DATOS SIMULADOS - MODO DEMOSTRACIÓN']);
  const csv = '﻿' + rows.map(r => r.map(v => { v = String(v ?? ''); return /[";\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';')).join('\r\n');
  if (EMBED) {
    openModal('Exportar CSV', `<p class="small">En esta vista previa la descarga directa está bloqueada. Copia el contenido y pégalo en un archivo .csv, o usa la versión publicada en Vercel, donde se descarga directamente.</p><textarea id="csvTxt" style="min-height:220px;font-family:ui-monospace,monospace;font-size:12px" readonly>${esc(csv.slice(1))}</textarea><div class="row"><button class="btn pri" id="csvCopy" type="button">Copiar CSV</button><span class="small muted">${esc(name)}</span></div>`, () => {
      $('#csvCopy').onclick = () => { const ta = $('#csvTxt'); (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(() => toast('CSV copiado.'), () => { ta.focus(); ta.select(); toast('Selecciona y copia el texto manualmente.', 'warn'); }); };
    });
    return;
  }
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('Reporte descargado. Se abre en Excel con columnas separadas.');
}

  },
  rConf() {
    const l = lote('l_res_cho'); if (l.estado === 'abierto') confirmarLote(l.id);
    dlog('sell', `<b>Reserva confirmada por Luis.</b> Valor asegurado antes de cosechar: <b>${fmtCLP(1000 * 360)}</b>. Esos 1.000 kg ya no se pueden ofrecer a otro comprador.`);
  },
  rDeliv() {
    const l = lote('l_res_cho'); if (l.estado === 'confirmado') entregarLote(l.id);
    dlog('sell', `<b>Cosecha entregada (simulada).</b> Luis cosechó y entregó 1.000 kg de choclo. Ingreso registrado: <b>${fmtCLP(360000)}</b>, visible en Mi Predio (temporada ${SEASONS()[2]}) y en Reportes.`);
  },
  tReq() {
    const l = DB.lotes.find(x => x.solicitudId === 's_conservas' && x.estado !== 'cancelado');
    let t = trasladoDe(l.id); if (!t) t = solicitarTraslado(l.id, {fecha:addDays(null, 2), pagador:'comprador', refrigerado:false, solicitante:'u_conservas'}).t;
    dlog('info', `<b>Caso 5 · Traslado solicitado.</b> Ruta ${esc(rutaTxt(t))}: ${t.paradas.map(p => `${esc(userName(p.farmerId))} ${fmtKg(p.kg)}`).join(' + ')}, ${t.km} km por camino. Vehículo: ${VEHICULOS[t.vehiculo].label}.<br>Flete para el transportista ${fmtCLP(t.flete)} + comisión Cosecha Conecta ${fmtCLP(t.comision)} = <b>${fmtCLP(t.total)}</b>, lo paga el comprador.`);
  },
  tAsig() {
    const l = DB.lotes.find(x => x.solicitudId === 's_conservas' && x.estado !== 'cancelado'); const t = trasladoDe(l.id);
    if (t.estado === 'solicitado') { const c = transportistasCompatibles(t)[0]; if (c) asignarTraslado(t.id, c.u.id); }
    dlog('info', `<b>Transportista asignado:</b> ${esc(userName(t.transportistaId))} ${ratingChip(t.transportistaId)}, el más cercano con ${VEHICULOS[t.vehiculo].label}.`);
  },
  tEnt() {
    const l = DB.lotes.find(x => x.solicitudId === 's_conservas' && x.estado !== 'cancelado'); const t = trasladoDe(l.id);
    while (t.estado === 'asignado' || t.estado === 'en_ruta') avanzarTraslado(t.id);
    const ing = ingresosPlataforma();
    dlog('sell', `<b>Carga entregada en San Fernando.</b> El transportista recibe ${fmtCLP(t.flete)} y Cosecha Conecta gana <b>${fmtCLP(t.comision)}</b> por el traslado.<br>Ingresos acumulados de la plataforma: ventas ${fmtCLP(ing.ventas)} + traslados ${fmtCLP(ing.traslados)} = <b>${fmtCLP(ing.total)}</b> (simulado).`);
  },
  sale() {
    const l = DB.lotes.find(x => x.solicitudId === 's_conservas' && x.estado !== 'cancelado');
    if (l.estado === 'confirmado') entregarLote(l.id);
    calificar(l.id, 'u_conservas', 'u_luis', 5, 'Tomate parejo y bien embalado. Volveremos a comprar.');
    calificar(l.id, 'u_conservas', 'u_carmen', 5, 'Cumplió los kilos comprometidos a tiempo.');
    calificar(l.id, 'u_luis', 'u_conservas', 5, 'Retiro puntual en el predio.');
    const luis = sum(l.aportes.filter(a => a.farmerId === 'u_luis'), 'kg') * l.precioKg;
    dlog('sell', `<b>Venta simulada registrada.</b> Ingreso de Luis: <b>${fmtCLP(luis)}</b> · Carmen: ${fmtCLP(sum(l.aportes.filter(a => a.farmerId === 'u_carmen'), 'kg') * l.precioKg)}. Los 2.000 kg que no tenían comprador ahora suman ingresos en Mi Predio y en Reportes.<br>Calificaciones: Conservas del Valle da <b>★★★★★</b> a Luis y a Carmen; Luis da ★★★★★ al comprador. La calificación de Luis sube a ${ratingOf('u_luis').avg.toLocaleString('es-CL', {minimumFractionDigits:1, maximumFractionDigits:1})} (${ratingOf('u_luis').n} opiniones).`);
  }
};
const isDone = k => (DB.demo.done || []).includes(k);
function runStep(k) {
  const s = DEMO_STEPS.find(x => x.k === k); if (!s) return;
  if (k !== 'start' && !isDone('start')) runStep('start');
  s.dep.forEach(d => { if (!isDone(d)) runStep(d); });
  DEMO_RUN[k](); if (!isDone(k)) DB.demo.done.push(k);
}
function runDemo(k) {
  if (!DB.demo.done) DB.demo.done = [];
  if (k === 'reset') return confirmBox('¿Reiniciar la demostración? Se vuelve a los datos ficticios iniciales.', () => { DB = seedDemo(); UI.predioId = null; UI.temporada = null; refresh(); toast('Demostración reiniciada.'); }, 'Reiniciar');
  if (k === 'hist') { if (!isDone('start')) runStep('start'); DB.currentUser = 'u_luis'; UI.repTemporada = 'todas'; save(); go('reportes'); return; }
  if (k === 'double') {
    if (!isDone('confirm')) runStep('confirm');
    const tmp = {id:'l_test', solicitudId:null, buyerId:'u_deshid', producto:'Tomate', meta:500, precioKg:470, colaborativo:false, estado:'abierto', creado:todayISO(), aportes:[], historial:[]};
    DB.lotes.push(tmp); const err = agregarAporte('l_test', 'o_case2', 500); DB.lotes = DB.lotes.filter(l => l.id !== 'l_test');
    dlog('warn', `<b>Prueba de doble compromiso.</b> Se intentó vender 500 kg de la misma cosecha de Luis a otro comprador. Resultado: <b>${err ? 'bloqueado' : 'permitido'}</b>.<br>${esc(err || '')}`);
    refresh(); return;
  }
  if (k === 'start') { DEMO_RUN.start(); DB.demo.done = ['start']; }
  else runStep(k);
  DB.currentUser = 'u_luis'; UI.predioId = 'pr_luis'; UI.temporada = SEASONS()[1];
  refresh();
  const el = $('#demoPanel .console'); if (el) el.scrollTop = 0;
}

/* ====================== Inicio ====================== */
DB = loadDB();
$('.skip-link').addEventListener('click', event => {
  event.preventDefault();
  $('#main').focus();
  $('#main').scrollIntoView();
});
route();
</script>
